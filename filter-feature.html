<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reservasi Medikids - Smart Filter</title>
    <!-- Memuat Bootstrap 5 via CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Sedikit kustomisasi agar tampilannya pas di tengah layar */
        body {
            background-color: #f8f9fa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .reservation-card {
            width: 100%;
            max-width: 450px;
            border-radius: 15px;
        }
    </style>
</head>
<body>

    <div class="card shadow-lg border-0 reservation-card p-4">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-primary">Reservasi Medikids</h3>
            <p class="text-muted small mb-0">Pilih dokter, layanan, atau cabang</p>
        </div>

        <form>
            <!-- Dropdown 1: Dokter -->
            <div class="mb-3">
                <label for="specialty" class="form-label fw-medium text-secondary small mb-1">Pilih Dokter</label>
                <select id="specialty" class="form-select border-secondary-subtle">
                    <option value="">-- Semua Dokter Spesialis --</option>
                </select>
            </div>

            <!-- Dropdown 2: Layanan -->
            <div class="mb-3">
                <label for="clinic" class="form-label fw-medium text-secondary small mb-1">Pilih Layanan</label>
                <select id="clinic" class="form-select border-secondary-subtle">
                    <option value="">-- Semua Layanan --</option>
                </select>
            </div>

            <!-- Dropdown 3: Cabang -->
            <div class="mb-3">
                <label for="location" class="form-label fw-medium text-secondary small mb-1">Pilihan Cabang</label>
                <select id="location" class="form-select border-secondary-subtle">
                    <option value="">-- Semua Cabang --</option>
                </select>
            </div>
        </form>

        <!-- Tombol Reset -->
        <div class="d-flex justify-content-end mb-3">
            <button type="button" id="btn-reset" class="btn btn-link text-danger text-decoration-none p-0 small fw-medium">
                Reset Pilihan
            </button>
        </div>

        <!-- Menampilkan hasil pilihan -->
        <div class="alert alert-primary mt-2 mb-0" role="alert">
            <h6 class="alert-heading fw-bold mb-2" style="font-size: 0.9rem;">Ringkasan Pilihan:</h6>
            <ul class="mb-0 small ps-3" style="list-style-type: square;">
                <li><span class="fw-semibold">Dokter:</span> <span id="summary-specialty">-</span></li>
                <li><span class="fw-semibold">Layanan:</span> <span id="summary-clinic">-</span></li>
                <li><span class="fw-semibold">Cabang:</span> <span id="summary-location">-</span></li>
            </ul>
        </div>
    </div>

    <!-- Logika JavaScript (Vanilla JS) -->
    <script>
        // --- DATA INDUK ---
        const locations = [
            { id: "loc-kemang", name: "Medikids Kemang" },
            { id: "loc-bintaro", name: "Medikids Bintaro" },
            { id: "loc-dago", name: "Medikids Dago Bandung" },
            { id: "loc-depok", name: "Medikids Wakaf Depok" },
            { id: "loc-makassar", name: "Medikids Makassar" }
        ];

        const specialties = [
            { id: "spes-umum", name: "Dokter Umum & Vaksinasi" },
            { id: "spes-anak", name: "Spesialis Anak" },
            { id: "spes-gigi-anak", name: "Spesialis Kedokteran Gigi Anak" },
            { id: "spes-gigi-umum", name: "Dokter Gigi Umum" },
            { id: "spes-ortho", name: "Spesialis Orthodonsia" },
            { id: "spes-prosto", name: "Spesialis Prostodonsia" },
            { id: "spes-tht", name: "Spesialis THT" },
            { id: "spes-psikolog", name: "Psikolog" }
        ];

        const clinics = [
            { id: "lay-vaksin-umum", name: "Layanan Vaksin & Umum" },
            { id: "lay-vaksin-flu", name: "Vaksin Flu" },
            { id: "lay-spes-anak", name: "Layanan Spesialis Anak" },
            { id: "lay-tumbuh-kembang", name: "Layanan Tumbuh Kembang Anak" },
            { id: "lay-gigi-anak", name: "Perawatan Gigi Anak" },
            { id: "lay-gigi-dewasa", name: "Perawatan Gigi Dewasa" },
            { id: "lay-kawat-gigi", name: "Perawatan Kawat Gigi" },
            { id: "lay-gigi-tiruan", name: "Gigi Tiruan" },
            { id: "lay-tht", name: "Layanan THT" },
            { id: "lay-parent-test", name: "Parent Test" }
        ];

        const availabilities = [
            { specialtyId: "spes-umum", clinicId: "lay-vaksin-umum", locationId: "loc-kemang" },
            { specialtyId: "spes-umum", clinicId: "lay-vaksin-flu", locationId: "loc-kemang" },
            { specialtyId: "spes-umum", clinicId: "lay-vaksin-umum", locationId: "loc-bintaro" },
            { specialtyId: "spes-umum", clinicId: "lay-vaksin-umum", locationId: "loc-depok" },
            { specialtyId: "spes-umum", clinicId: "lay-vaksin-umum", locationId: "loc-makassar" },
            { specialtyId: "spes-anak", clinicId: "lay-spes-anak", locationId: "loc-kemang" },
            { specialtyId: "spes-anak", clinicId: "lay-tumbuh-kembang", locationId: "loc-kemang" },
            { specialtyId: "spes-anak", clinicId: "lay-spes-anak", locationId: "loc-bintaro" },
            { specialtyId: "spes-psikolog", clinicId: "lay-parent-test", locationId: "loc-kemang" },
            { specialtyId: "spes-gigi-anak", clinicId: "lay-gigi-anak", locationId: "loc-kemang" },
            { specialtyId: "spes-gigi-anak", clinicId: "lay-gigi-anak", locationId: "loc-bintaro" },
            { specialtyId: "spes-gigi-anak", clinicId: "lay-gigi-anak", locationId: "loc-dago" },
            { specialtyId: "spes-gigi-anak", clinicId: "lay-gigi-anak", locationId: "loc-depok" },
            { specialtyId: "spes-gigi-umum", clinicId: "lay-gigi-dewasa", locationId: "loc-kemang" },
            { specialtyId: "spes-gigi-umum", clinicId: "lay-gigi-dewasa", locationId: "loc-bintaro" },
            { specialtyId: "spes-gigi-umum", clinicId: "lay-gigi-dewasa", locationId: "loc-dago" },
            { specialtyId: "spes-gigi-umum", clinicId: "lay-gigi-dewasa", locationId: "loc-makassar" },
            { specialtyId: "spes-ortho", clinicId: "lay-kawat-gigi", locationId: "loc-kemang" },
            { specialtyId: "spes-ortho", clinicId: "lay-kawat-gigi", locationId: "loc-dago" },
            { specialtyId: "spes-ortho", clinicId: "lay-kawat-gigi", locationId: "loc-makassar" },
            { specialtyId: "spes-prosto", clinicId: "lay-gigi-tiruan", locationId: "loc-kemang" },
            { specialtyId: "spes-tht", clinicId: "lay-tht", locationId: "loc-kemang" }
        ];

        // --- STATE VARIABLES ---
        let selectedLocation = "";
        let selectedClinic = "";
        let selectedSpecialty = "";

        // --- DOM ELEMENTS ---
        const elSpecialty = document.getElementById('specialty');
        const elClinic = document.getElementById('clinic');
        const elLocation = document.getElementById('location');
        const btnReset = document.getElementById('btn-reset');

        // Helper untuk mendapatkan nama berdasarkan ID
        const getName = (arr, id) => arr.find(item => item.id === id)?.name || "-";

        // --- FUNGSI UPDATE UI (Sistem Render Manual) ---
        function updateUI() {
            // 1. Logika Smart Filter (Menyaring Opsi)
            const availableSpecialties = specialties.filter(s => 
                !selectedLocation && !selectedClinic ? true : 
                availabilities.some(a => 
                    a.specialtyId === s.id && 
                    (!selectedLocation || a.locationId === selectedLocation) &&
                    (!selectedClinic || a.clinicId === selectedClinic)
                )
            );

            const availableClinics = clinics.filter(c => 
                !selectedLocation && !selectedSpecialty ? true :
                availabilities.some(a => 
                    a.clinicId === c.id && 
                    (!selectedLocation || a.locationId === selectedLocation) &&
                    (!selectedSpecialty || a.specialtyId === selectedSpecialty)
                )
            );

            const availableLocations = locations.filter(loc => 
                !selectedSpecialty && !selectedClinic ? true :
                availabilities.some(a => 
                    a.locationId === loc.id && 
                    (!selectedSpecialty || a.specialtyId === selectedSpecialty) &&
                    (!selectedClinic || a.clinicId === selectedClinic)
                )
            );

            // 2. Render Ulang Opsi Dropdown
            // Spesialis
            elSpecialty.innerHTML = '<option value="">-- Semua Dokter Spesialis --</option>';
            availableSpecialties.forEach(spes => {
                const isSelected = spes.id === selectedSpecialty ? 'selected' : '';
                elSpecialty.innerHTML += `<option value="${spes.id}" ${isSelected}>${spes.name}</option>`;
            });

            // Layanan
            elClinic.innerHTML = '<option value="">-- Semua Layanan --</option>';
            availableClinics.forEach(clin => {
                const isSelected = clin.id === selectedClinic ? 'selected' : '';
                elClinic.innerHTML += `<option value="${clin.id}" ${isSelected}>${clin.name}</option>`;
            });

            // Lokasi
            elLocation.innerHTML = '<option value="">-- Semua Cabang --</option>';
            availableLocations.forEach(loc => {
                const isSelected = loc.id === selectedLocation ? 'selected' : '';
                elLocation.innerHTML += `<option value="${loc.id}" ${isSelected}>${loc.name}</option>`;
            });

            // 3. Update Teks Ringkasan
            document.getElementById('summary-specialty').innerText = getName(specialties, selectedSpecialty);
            document.getElementById('summary-clinic').innerText = getName(clinics, selectedClinic);
            document.getElementById('summary-location').innerText = getName(locations, selectedLocation);
        }

        // --- EVENT LISTENERS (Handlers) ---

        elSpecialty.addEventListener('change', (e) => {
            selectedSpecialty = e.target.value;

            const validAvails = availabilities.filter(a => a.specialtyId === selectedSpecialty);
            const validClinics = [...new Set(validAvails.map(a => a.clinicId))];
            const validLocs = [...new Set(validAvails.map(a => a.locationId))];

            if (selectedClinic && !validClinics.includes(selectedClinic)) selectedClinic = "";
            if (selectedLocation && !validLocs.includes(selectedLocation)) selectedLocation = "";

            if (validClinics.length === 1) selectedClinic = validClinics[0];
            if (validLocs.length === 1) selectedLocation = validLocs[0];

            updateUI();
        });

        elClinic.addEventListener('change', (e) => {
            selectedClinic = e.target.value;

            const validAvails = availabilities.filter(a => a.clinicId === selectedClinic);
            const validSpes = [...new Set(validAvails.map(a => a.specialtyId))];
            const validLocs = [...new Set(validAvails.map(a => a.locationId))];

            if (selectedSpecialty && !validSpes.includes(selectedSpecialty)) selectedSpecialty = "";
            if (selectedLocation && !validLocs.includes(selectedLocation)) selectedLocation = "";

            if (validSpes.length === 1) selectedSpecialty = validSpes[0];
            if (validLocs.length === 1) selectedLocation = validLocs[0];

            updateUI();
        });

        elLocation.addEventListener('change', (e) => {
            selectedLocation = e.target.value;

            const validAvails = availabilities.filter(a => a.locationId === selectedLocation);
            const validSpes = [...new Set(validAvails.map(a => a.specialtyId))];
            const validClinics = [...new Set(validAvails.map(a => a.clinicId))];

            if (selectedSpecialty && !validSpes.includes(selectedSpecialty)) selectedSpecialty = "";
            if (selectedClinic && !validClinics.includes(selectedClinic)) selectedClinic = "";

            if (validSpes.length === 1) selectedSpecialty = validSpes[0];
            if (validClinics.length === 1) selectedClinic = validClinics[0];

            updateUI();
        });

        // Event Reset
        btnReset.addEventListener('click', () => {
            selectedSpecialty = "";
            selectedClinic = "";
            selectedLocation = "";
            updateUI();
        });

        // --- INISIALISASI PERTAMA ---
        // Panggil fungsi render sekali saat halaman dimuat
        updateUI();

    </script>
</body>
</html>
